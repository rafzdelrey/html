<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Tugas 17</title>
</head>
<body>
    <h1>Formulir Pendaftaran</h1>

    <form action="" method="get">
        <p>
            <label for="cari">Cari Data :</label>
            <input type="search" id="cari" name="cari">
        </p>

        <p>
            <label for="nama">Nama Lengkap :</label>
            <input type="text" id="nama" name="nama">
        </p>

        <p>
            <label for="website">Alamat Website :</label>
            <input type="url" id="website" name="website" autofocus>
        </p>

        <p>
            <label for="umur">Umur :</label>
            <input type="number" id="umur" name="umur" min="1" max="120" style="width: 80px;">
        </p>

        <p>
            <label for="hp">No Hp :</label>
            <input type="tel" id="hp" name="hp">
        </p>

        <p>
            <label for="paham">Seberapa mengerti Anda tentang materi ini?</label>
            <input type="range" id="paham" name="paham" min="0" max="100" value="50">
        </p>

        <p>
            <input type="submit" value="Submit">
        </p>
    </form>
</body>
</html>
