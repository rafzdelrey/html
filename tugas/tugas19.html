<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Formulir Biodata Diri</title>
</head>
<body>
  <h1>Formulir Biodata Diri</h1>

  <form>
    <hr>
    Nama : <input type="text" name="nama">
    <hr>
    Pas Foto : <input type="file" name="foto">
    <hr>
    Jenis Kelamin :
    <input type="radio" name="gender" value="pria">Pria
    <input type="radio" name="gender" value="wanita">Wanita
    <hr>
    Hobi :
    <input type="checkbox" name="hobi" value="sepakbola">Sepak Bola
    <input type="checkbox" name="hobi" value="bulutangkis">Bulu Tangkis
    <input type="checkbox" name="hobi" value="membaca">Membaca Buku
    <hr>
  </form>
</body>
</html>
