<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>TUGAS 22</title>
</head>
<body>
    <h1>Napak Tilas</h1>

    <fieldset>
        <legend>Form</legend>
        <form action="#" method="post">
            <table>
                <tr>
                    <td>Nama</td>
                    <td>:</td>
                    <td><input type="text" name="nama" placeholder="Nama lengkap..."></td>
                </tr>
                <tr>
                    <td>Username</td>
                    <td>:</td>
                    <td><input type="text" name="username" placeholder="Username..."></td>
                </tr>
                <tr>
                    <td>Email</td>
                    <td>:</td>
                    <td><input type="email" name="email" placeholder="Your email..."></td>
                </tr>
                <tr>
                    <td>Password</td>
                    <td>:</td>
                    <td><input type="password" name="password" placeholder="Passowrd..."></td>
                </tr>
                <tr>
                    <td>Alamat Web</td>
                    <td>:</td>
                    <td><input type="url" name="alamat_web" placeholder="Masukan URL Web..."></td>
                </tr>
                <tr>
                    <td>Tanggal Lahir</td>
                    <td>:</td>
                    <td><input type="date" name="tanggal_lahir"></td>
                </tr>
                <tr>
                    <td>Umur</td>
                    <td>:</td>
                    <td><input type="number" name="umur" min="0" style="width: 70px;"></td>
                </tr>
                <tr>
                    <td>Jenis kelamin</td>
                    <td>:</td>
                    <td>
                        <input type="radio" name="jenis_kelamin" value="Laki-laki"> Laki-laki
                        <input type="radio" name="jenis_kelamin" value="Perempuan"> Perempuan
                    </td>
                </tr>
                <tr>
                    <td>Agama</td>
                    <td>:</td>
                    <td>
                        <select name="agama">
                            <option value="Islam">Islam</option>
                            <option value="Kristen">Kristen</option>
                            <option value="Katolik">Katolik</option>
                            <option value="Hindu">Hindu</option>
                            <option value="Buddha">Buddha</option>
                            <option value="Konghucu">Konghucu</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>Biografi</td>
                    <td>:</td>
                    <td><textarea name="biografi" rows="3" cols="22"></textarea></td>
                </tr>
                <tr>
                    <td>Foto</td>
                    <td></td>
                    <td>
                    
                        <img src="img/telur.png" alt="Foto" width="282" height="282">
                    </td>
                </tr>
                <tr>
                    <td>Audio</td>
                    <td>:</td>
                    <td>
                
                        <audio controls>
                            <source src="lagu1.mp3" type="audio/mpeg">
                            Browser kamu tidak mendukung audio.
                        </audio>
                    </td>
                </tr>
            </table>
        </form>
    </fieldset>

    <p>Semoga ilmu yang dipelajari berkah - Tugas 15</p>
</body>
</html>
