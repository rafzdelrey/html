<body>

    <form action="" method="post" autocomplete="on">
        <input type="email" name="email" placeholder="Email" list="daftar-email" autocomplete="on">
        <datalist id="daftar-email">
            <option value="a@mail.com">
            <option value="rafi@mail.com">

        <br><br>
        <input type="password" name="pin" placeholder="PIN" maxlength="6" autocomplete="off">
    </form>

    <p>Semoga ilmu yang dipelajari berkah - Tugas 16</p>
</body>
</html>
